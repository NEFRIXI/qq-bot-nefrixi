# ============================================================
# 本机专用配置 —— 这里放真实凭证
#
# 因为原来application-local.gitignore 忽略，不会被提交到 git 仓库。
#所以这不会是让你二次开发时候，直接的填数据或者说让你充当application-local.模板的，如果要使用的话，直接去掉后面文件名的-model
# 它由 application.yml 里的 spring.profiles.active: local 自动加载，
# 并且会【覆盖】application.yml 里同名的配置项。
#
# 你只需要填下面两处带 "← 填这里" 的地方。
# ============================================================

app:
  qq:
    # 去 QQ 开放平台 → 你的机器人 → 开发管理，复制 AppSecret 粘到这里
    # 注意保留引号，因为 Secret 里可能包含特殊字符
    app-secret: "you_app_sercret"        # ← 填这里

  # ----------------------------------------------------------
  # 管理员白名单（腾讯 openid，不是 QQ 号）
  #
  # 【推荐：留空，什么都不用填】
  # 名单为空时，第一个给机器人发消息的人会【自动成为管理员】，
  # 并写进 data/admin-ids.txt（重启不丢）。
  # 所以正常情况下你不需要在这里填任何东西——直接在 QQ 里发条消息就行。
  #
  # 【什么时候需要填这里？】
  # 想固定一批管理员、不想依赖自动认领时。
  # 获取标识的方法：在 QQ 里发 /whoami，复制它单独列出的那串。
  #
  # 注意两者的生效时机不同：
  #   · 写在这里的         —— 需要重启应用才生效
  #   · data/admin-ids.txt —— 立即生效（自动认领或 /claim 写入）
  # ----------------------------------------------------------
  admin:
    user-ids: []

  llm:
    cloud:
      # 云端大模型（DeepSeek）的 API Key。
      #
      # 什么时候会用到它，由【路由策略】决定，不是由 app.role 决定：
      #   strategy: LOCAL_FIRST（当前默认）→ 本地算力可用就用本地，
      #                                      本地不可用才降级到这里
      #   strategy: CLOUD_FIRST / CLOUD_ONLY → 每次都走这里（按 token 计费）
      #   strategy: LOCAL_ONLY → 本地不可用时直接报错，绝不走这里
      #
      # 注意：app.role 已经不影响算力选择了（它只管 /status 的显示），
      # 改 role 不会让聊天切到本地 —— 别被老提示语误导。
      api-key: "you_api"
