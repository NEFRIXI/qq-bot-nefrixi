<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑文章 · WN 后台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="description" content="WN 后台编辑文章。">
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body data-page="article-edit">

<header class="admin-bar" id="adminBar"></header>

<main class="container-wide admin-main">
    <div class="admin-head">
        <div>
            <!-- 新建和编辑共用这一页，标题与副题由 admin.js 改 -->
            <h1 id="pageTitle">编辑文章</h1>
            <p class="sub">编号 <span id="editId">—</span> · 正文用 Markdown 写</p>
        </div>
        <a class="btn btn-sm" href="/admin/work/articles">返回列表</a>
    </div>

    <div id="formBox">
        <form id="articleForm">
            <div class="edit-grid">
                <!-- 左：正文。宽度给满，写长文时才用得上 -->
                <div class="edit-main">
                    <div class="card">
                        <div class="field">
                            <label for="titleInput">标题</label>
                            <input class="input" id="titleInput" maxlength="200">
                        </div>

                        <div class="field">
                            <label for="contentInput">正文</label>
                            <textarea class="textarea textarea-mono" id="contentInput"></textarea>
                            <p class="hint">支持 # 标题、**粗体**、`代码`、&gt; 引用、- 列表</p>
                        </div>
                    </div>
                </div>

                <!-- 右：发布信息。窄栏，和左边形成主次 -->
                <aside class="edit-side">
                    <div class="card">
                        <div class="field">
                            <label for="statusInput">状态</label>
                            <select class="select" id="statusInput">
                                <option value="1" selected>发布（所有人可见）</option>
                                <option value="0">存草稿（只有自己可见）</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="slugInput">地址标识</label>
                            <input class="input" id="slugInput" maxlength="120">
                            <p class="hint">留空会自动生成。改过的地址，旧链接就失效了。</p>
                        </div>

                        <div class="field">
                            <label for="summaryInput">摘要</label>
                            <textarea class="textarea" id="summaryInput" maxlength="300"
                                      style="min-height: 84px"></textarea>
                        </div>

                        <div class="form-actions">
                            <button class="btn btn-primary" id="saveBtn" type="submit">保存</button>
                            <button class="btn btn-danger" id="deleteBtn" type="button">删除</button>
                        </div>
                    </div>

                    <!-- 创建时间 / 修改时间 / 数据：只在编辑已有文章时出现 -->
                    <div class="card" id="metaBox"></div>
                </aside>
            </div>
        </form>
    </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
