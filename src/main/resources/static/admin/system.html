<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器状态 · WN 后台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="description" content="WN 后台服务器状态。">
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body data-page="system">

<header class="admin-bar" id="adminBar"></header>

<main class="container-wide admin-main">
    <div class="admin-head">
        <div>
            <h1>服务器状态</h1>
            <p class="sub">内存、CPU、磁盘、线程，以及数据库与 Redis 的连通性</p>
        </div>
        <!-- 真要重新取数就整页重载：这一页的数据全部是"读一次"的，
             轮询没有意义，还会让数据库连接数忽高忽低 -->
        <button class="btn btn-sm" id="refreshBtn" onclick="location.reload()">重新检测</button>
    </div>

    <div id="statusBox"></div>
</main>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
