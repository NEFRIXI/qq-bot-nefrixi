<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理 · WN 后台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="description" content="WN 后台文章管理。">
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body data-page="articles">

<header class="admin-bar" id="adminBar"></header>

<main class="container-wide admin-main">
    <div class="admin-head">
        <div>
            <h1>文章管理</h1>
            <p class="sub">发布、转回草稿、删除。草稿只有你自己看得见。</p>
        </div>

        <div class="row-wrap">
            <!-- 筛选是链接，不是按钮：状态在地址栏里，刷新和分享都能带过去。
                 当前项由 admin.js 加 .is-active -->
            <div class="filter-group">
                <a href="/admin/work/articles">全部</a>
                <a href="/admin/work/articles?status=1">已发布</a>
                <a href="/admin/work/articles?status=0">草稿</a>
            </div>
            <a class="btn btn-primary btn-sm" href="/admin/work/articles/new">写新文章</a>
        </div>
    </div>

    <!-- 表格由 admin.js 填（含空态与错误态的重试按钮） -->
    <div id="articleTableBox"></div>
</main>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
