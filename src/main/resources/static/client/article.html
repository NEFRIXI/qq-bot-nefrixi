<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 · WN</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="description" content="读一篇。正文、点赞与读者留言。">
    <meta name="theme-color" content="#0B0A12">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/main.css">
</head>

<!-- data-page="article"：正文区和评论区都由 JS 填 -->
<body data-page="article">

<aside class="music-rail">
    <p class="rail-head">CURATED<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="17" r="3.2"/><rect x="10.2" y="3" width="1.8" height="14"/><path d="M12 3.4 L18.4 5.6 L18.4 9.8 L12 7.6 Z"/></svg></p>
    <div class="track" id="musicTrack"></div>
</aside>

<div class="page-main">

    <div class="read-progress" id="readProgress"></div>

    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="/client">
                <span class="brand-dot"></span>
                WN
            </a>
            <nav class="topbar-links">
                <a href="/client/main">全部文章</a>
                <a href="/client/post">写文章</a>
                <a href="/client">首页</a>
                <span class="topbar-user-box" id="userBox"></span>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- 整篇正文（标题、元信息、正文、点赞）由 main.js 拼好塞进来 -->
        <div id="articleBox"></div>

        <section class="comments-section">
            <h2 class="comments-title">评论</h2>
            <!-- 发表框 / 未登录提示由 user.js 决定用哪一个 -->
            <div id="commentFormBox"></div>
            <div id="commentsBox"></div>
        </section>
    </main>

    <footer class="site-foot container">
        <p>WN · 个人站点</p>
    </footer>

</div>

<audio id="audioPlayer" preload="none"></audio>

<script src="/js/common.js"></script>
<script src="/js/main.js"></script>
<script src="/js/user.js"></script>
</body>
</html>
