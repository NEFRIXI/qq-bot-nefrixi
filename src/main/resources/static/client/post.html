<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 · WN</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="description" content="写一篇新帖子，也可以管理自己发过的。">
    <meta name="theme-color" content="#0B0A12">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/main.css">
</head>

<body data-page="post">

<div class="page-main">

    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="/client">
                <span class="brand-dot"></span>
                WN
            </a>
            <nav class="topbar-links">
                <a href="/client/main">全部文章</a>
                <a href="/client">首页</a>
                <span class="topbar-user-box" id="userBox"></span>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-head">
            <h1>写文章</h1>
            <p>正文支持 Markdown：<code># 标题</code>、<code>**粗体**</code>、<code>`代码`</code> 都能用</p>
            <div class="head-divider" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>

        <!-- 未登录时整块被 user.js 换成"发帖需要先登录"的挡板 -->
        <div id="postFormBox">
            <div class="card post-card">
                <form id="postForm" autocomplete="off">
                    <div class="field">
                        <label for="postTitle">标题</label>
                        <input class="input" id="postTitle" maxlength="200"
                               placeholder="给这篇文章起个名字" required>
                    </div>

                    <div class="field">
                        <label for="postContent">正文</label>
                        <textarea class="input post-content" id="postContent"
                                  placeholder="开始写吧…" required></textarea>
                        <p class="hint">发布后所有人可见。想改的话，目前只能删掉重发。</p>
                    </div>

                    <div class="post-actions">
                        <button class="btn btn-primary" type="submit" id="postSubmit">发布</button>
                        <span class="post-actions-hint" id="postActionsHint"></span>
                    </div>
                </form>
            </div>
        </div>

        <section class="my-posts">
            <h2 class="my-posts-title">我发过的</h2>
            <div id="myPostsBox"></div>
        </section>
    </main>

    <footer class="site-foot container">
        <p>WN · 个人站点</p>
    </footer>

</div>

<script src="/js/common.js"></script>
<script src="/js/user.js"></script>
</body>
</html>
