<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜好眠 · WN</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="description" content="夜好眠的个人站点。记录、整理与分享。">
    <meta name="theme-color" content="#0B0A12">
    <style>
        /* ============================================================
           欢迎页 —— 一张照片，一本封面
           ------------------------------------------------------------
           这一页是自成一体的：样式内联，不引 common.css / main.css。
           原因在项目说明里写过 —— 它是整个站的"封面"，也是最容易被
           单独打开、单独分享的一页，不该为一页的排版拖两个文件进来。

           ── 这一版的结构 ──
           背景照片（含 Ken Burns 呼吸）一个字节都没改，它是地基。
           改的是它上面那层：
             · 压暗层从"左到右"改成"左下到右上"，让画面右下角透出来
             · 加一层 6px 网点：印刷放大后的痕迹，不是噪点滤镜
             · 标题改成"套印错位"——樱粉一层错开 4px 垫在暖白下面
               （同人本套色没对齐就是这个样子，比模糊重影更像印刷）
             · 右下角把原来的状态卡改成一张"小票"：撕齿边、等宽数字
             · 左下角一枚竖排刊号，代替原来的 SEED 签名

           零外部依赖：没有 CDN、没有字体文件、没有图标库。
           图标全部是内联 SVG 或 CSS 画的。
           ============================================================ */

        /* ---------- 基础 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;            /* 全屏页，禁止滚动条 */
            background: #0B0A12;         /* 图片加载前的底色，避免白闪 */
        }

        body {
            font-family: system-ui, -apple-system, "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei",
                         "Noto Sans SC", sans-serif;
            color: #F7F2E9;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: #3BE0C4;
            color: #0B0A12;
        }

        :focus-visible {
            outline: 2px solid #3BE0C4;
            outline-offset: 3px;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* ---------- 背景照片（未改动） ---------- */
        .bg {
            position: absolute;
            inset: 0;
            background-image: url("/client/images/welcome-bg.jpg");
            background-size: cover;
            background-position: center;
            /* 初始略微放大，给 Ken Burns 留出位移空间 */
            transform: scale(1.05);
            animation: kenBurns 28s ease-in-out infinite alternate;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .bg.loaded {
            opacity: 1;
        }

        /* 28 秒是刻意的：慢了才像"呼吸"，快了会变成明显的缩放动画 */
        @keyframes kenBurns {
            from { transform: scale(1.05) translate(0, 0); }
            to   { transform: scale(1.16) translate(-1.5%, -1%); }
        }

        /* ---------- 压暗层 ----------
           两个渐变：
             左下深 → 文字在左边，必须压住
             整体薄一层 → 保证任何照片上文字都够对比
           压得比上一版浅，因为这一版想让照片右下的樱花留出来。 */
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(104deg,
                    rgba(11, 10, 18, 0.88) 0%,
                    rgba(11, 10, 18, 0.62) 30%,
                    rgba(11, 10, 18, 0.14) 62%,
                    rgba(11, 10, 18, 0) 82%),
                linear-gradient(to top,
                    rgba(11, 10, 18, 0.72) 0%,
                    rgba(11, 10, 18, 0) 46%);
        }

        /* ---------- 网点 ----------
           6px 的规矩点阵，透明度 0.05。
           它不是"噪点滤镜"：网点是等距的，噪点是随机的，
           前者是印刷的痕迹，后者是相机的痕迹。 */
        .halftone {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.5;
            background-image: radial-gradient(circle at center,
                rgba(247, 242, 233, 0.35) 0.7px, transparent 0.8px);
            background-size: 6px 6px;
            mix-blend-mode: soft-light;
        }

        /* ---------- 樱花 ----------
           保留原页的彩蛋，但压慢、减少数量、缩小尺寸：
           这一版的主视觉是封面字，花瓣只做背景里的动静。 */
        .petals {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -8%;
            border-radius: 100% 0 100% 0;
            background: linear-gradient(135deg,
                hsl(var(--hue, 324), 100%, 93%) 0%,
                hsl(var(--hue, 324), 94%, 80%) 55%,
                hsl(var(--hue, 324), 88%, 68%) 100%);
            opacity: 0.85;
            will-change: transform;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes fall {
            0% {
                transform: translate3d(0, 0, 0) rotate(0deg);
                opacity: 0;
            }
            8%  { opacity: 0.85; }
            90% { opacity: 0.8; }
            100% {
                transform: translate3d(var(--drift, 60px), 115vh, 0) rotate(540deg);
                opacity: 0;
            }
        }

        /* ---------- 封面（左侧文字块） ---------- */
        .cover {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            padding: 0 7vw;
            max-width: 760px;
        }

        /* 刊号：竖排，压在标题左边，像书脊上的字 */
        .issue {
            position: absolute;
            top: 50%;
            left: 2.6vw;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            font-size: 0.62rem;
            letter-spacing: 0.36em;
            color: rgba(247, 242, 233, 0.42);
            writing-mode: vertical-rl;
            pointer-events: none;
            animation: fadeIn 1.6s ease 1.2s both;
        }

        .issue i {
            display: block;
            width: 1px;
            height: 56px;
            background: linear-gradient(to bottom,
                rgba(247, 242, 233, 0.42), rgba(247, 242, 233, 0));
        }

        /* ---------- 标题 + 套印错位 ----------
           重影不是模糊的：它是一层实色的樱粉，错开 4px、压在下面，
           而且只露出一点点（透明度 0.5）。
           同人本套色没对齐，看到的就是一道硬边的色影，不是柔光。 */
        .title {
            position: relative;
            width: fit-content;
            font-size: clamp(3rem, 9vw, 6rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.01em;
            color: #F7F2E9;
            transform: skewX(-2.4deg);
            text-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
            animation: riseIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        .title::before {
            content: attr(data-text);
            position: absolute;
            left: 5px;
            top: 4px;
            z-index: -1;
            color: rgba(255, 127, 174, 0.55);
            text-shadow: none;
            pointer-events: none;
            user-select: none;
        }

        /* ---------- 断线 ----------
           44 / 24 / 8 递减到无。这套版式的记号：
           它表示"这句话说完了"，同时给标题和正文之间留一口气。 */
        .rule {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 1.5rem 0 1.2rem;
        }

        .rule i {
            display: block;
            height: 2px;
            background: #3BE0C4;
            animation: lineGrow 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .rule i:nth-child(1) { width: 44px; animation-delay: 0.5s; }
        .rule i:nth-child(2) { width: 24px; opacity: 0.55; animation-delay: 0.58s; }
        .rule i:nth-child(3) { width: 8px; opacity: 0.28; animation-delay: 0.66s; }

        /* ---------- 副题 ---------- */
        .tagline {
            font-size: clamp(0.88rem, 1.5vw, 1rem);
            font-weight: 300;
            letter-spacing: 0.14em;
            line-height: 1.9;
            color: rgba(247, 242, 233, 0.8);
            animation: riseIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
        }

        /* ---------- 进入按钮 ----------
           实心青绿方块 + 斜切角。这是全站唯一一处"实心强调块"，
           因为它是这一页唯一要做的事。 */
        .enter {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 2.4rem;
            padding: 0 26px;
            height: 52px;
            width: fit-content;
            background: #3BE0C4;
            color: #0B0A12;
            font-size: 0.98rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-decoration: none;
            /* 左下角切掉一块：印刷品上常见的裁切角 */
            clip-path: polygon(0 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            transition: background-color 0.22s ease, transform 0.22s ease;
            animation: riseIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.64s both;
        }

        .enter svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: transform 0.22s ease;
        }

        .enter:hover {
            background: #62EBD3;
            transform: translateY(-2px);
        }

        .enter:hover svg {
            transform: translateX(4px);
        }

        .enter:active {
            transform: translateY(0);
        }

        /* ---------- 右上角两个入口 ----------
           两枚贴纸：管理员那颗压低对比，不知道有后台的人不会注意它。
           底色不能太淡：这片背景是樱花的亮区（亮度 240 上下），
           半透明白字压上去等于隐形。 */
        .top-entries {
            position: fixed;
            top: 24px;
            right: 26px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .entry-pill {
            padding: 6px 15px;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            color: rgba(247, 242, 233, 0.82);
            text-decoration: none;
            border: 1px solid rgba(247, 242, 233, 0.28);
            border-radius: 999px;
            white-space: nowrap;
            background: rgba(11, 10, 18, 0.46);
            backdrop-filter: blur(6px);
            text-shadow: 0 1px 3px rgba(11, 10, 18, 0.7);
            transition: color 0.22s ease, border-color 0.22s ease, background 0.22s ease;
        }

        .entry-pill:hover {
            color: #F7F2E9;
            border-color: rgba(247, 242, 233, 0.7);
            background: rgba(11, 10, 18, 0.68);
        }

        .admin-entry {
            opacity: 0.66;
        }

        .admin-entry:hover {
            opacity: 1;
        }

        /* ---------- 右下角：状态小票 ----------
           三行等宽数字，上边一排撕齿。
           它只说三件事：在线、内存占用、已运行多久 ——
           公开页面不该暴露 MySQL/Redis/磁盘路径（那是后台的事）。 */
        .ticket {
            position: fixed;
            right: 26px;
            bottom: 26px;
            z-index: 40;
            width: 152px;
            padding: 13px 14px 12px;
            background: rgba(11, 10, 18, 0.62);
            backdrop-filter: blur(8px);
            border-top: 1px dashed rgba(247, 242, 233, 0.28);
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            /* 数据没到之前整张不出现 —— 免得先画个空壳再让数字跳一下 */
            opacity: 0;
            translate: 0 10px;
            transition: opacity 0.9s ease, translate 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .ticket.is-ready {
            opacity: 1;
            translate: 0 0;
        }

        /* 撕齿：沿上边打一排半圆孔，像打孔纸带撕下来的那一截。
           孔用的是页面底色，所以它只在深色照片上成立 —— 这正是我们想要的。 */
        .ticket::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background-image: radial-gradient(circle at 4.5px -1px,
                #0B0A12 2.4px, transparent 2.6px);
            background-size: 9px 9px;
            background-repeat: repeat-x;
        }

        .ticket-head {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 9px;
            padding-bottom: 7px;
            border-bottom: 1px dashed rgba(247, 242, 233, 0.22);
            font-size: 0.62rem;
            letter-spacing: 0.2em;
            color: rgba(247, 242, 233, 0.7);
        }

        /* 在线点：慢慢呼吸，但不抢眼 */
        .ticket-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4FE08A;
            box-shadow: 0 0 7px rgba(79, 224, 138, 0.9);
            animation: pulse 3.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.45; transform: scale(0.78); }
        }

        .ticket-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.66rem;
            line-height: 1.9;
            color: rgba(247, 242, 233, 0.5);
            letter-spacing: 0.04em;
        }

        .ticket-row b {
            font-weight: 500;
            color: #F7F2E9;
            font-variant-numeric: tabular-nums;
        }

        /* 内存环：小尺寸，只作"看得见的百分比"，不做装饰 */
        .ring {
            position: relative;
            width: 40px;
            height: 40px;
            margin: 6px auto 2px;
        }

        .ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-track {
            fill: none;
            stroke: rgba(247, 242, 233, 0.14);
            stroke-width: 5;
        }

        .ring-fill {
            fill: none;
            stroke: #3BE0C4;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dashoffset: 258;
            transition: stroke-dashoffset 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ring-num {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.58rem;
            color: #F7F2E9;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- 入场 / 离场 ---------- */
        @keyframes riseIn {
            from { opacity: 0; translate: 0 22px; }
            to   { opacity: 1; translate: 0 0; }
        }

        @keyframes lineGrow {
            from { opacity: 0; width: 0 !important; }
            to   { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* 点"进入"之后：背景推进并失焦，文字上浮退场，一层白光铺满。
           三层各自动，才有"镜头推进"而不是"淡出换页"。 */
        body.leaving .bg {
            transition: transform 0.85s cubic-bezier(0.4, 0, 0.6, 1),
                        filter 0.85s ease;
            transform: scale(1.3);
            filter: blur(7px) brightness(1.3);
        }

        body.leaving .cover {
            transition: opacity 0.5s ease, transform 0.7s cubic-bezier(0.4, 0, 0.6, 1);
            opacity: 0;
            transform: translateY(-38px) scale(0.97);
        }

        body.leaving .petals,
        body.leaving .ticket,
        body.leaving .issue,
        body.leaving .halftone {
            transition: opacity 0.6s ease;
            opacity: 0;
        }

        .flash {
            position: absolute;
            inset: 0;
            z-index: 60;
            background: radial-gradient(circle at 50% 50%,
                rgba(247, 242, 233, 1) 0%,
                rgba(59, 224, 196, 0.6) 34%,
                rgba(11, 10, 18, 0) 74%);
            opacity: 0;
            transform: scale(0.35);
            pointer-events: none;
        }

        body.leaving .flash {
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.4, 0, 0.6, 1);
            opacity: 1;
            transform: scale(2.6);
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 760px) {
            .cover {
                padding: 0 7vw;
                max-width: none;
                align-items: center;
                text-align: center;
            }

            /* 窄屏照片两侧被裁，人物可能跑到中间：压暗改成上下 */
            .vignette {
                background:
                    linear-gradient(to bottom,
                        rgba(11, 10, 18, 0.72) 0%,
                        rgba(11, 10, 18, 0.5) 44%,
                        rgba(11, 10, 18, 0.78) 100%);
            }

            /* 左边没有空间放刊号，收掉 */
            .issue {
                display: none;
            }

            .title {
                /* 居中时去掉斜切：居中的斜行看起来像没对齐 */
                transform: none;
            }

            .title::before {
                left: 3px;
                top: 3px;
            }

            .rule {
                justify-content: center;
            }

            .enter {
                align-self: center;
            }

            .ticket {
                right: 14px;
                bottom: 14px;
                width: 124px;
                padding: 10px 11px;
            }

            .ticket-row {
                font-size: 0.6rem;
            }

            .top-entries {
                top: 16px;
                right: 14px;
                gap: 6px;
            }

            .entry-pill {
                padding: 5px 11px;
                font-size: 0.72rem;
            }
        }

        /* ---------- 尊重系统的"减少动态效果" ---------- */
        @media (prefers-reduced-motion: reduce) {
            .bg,
            .petal,
            .title,
            .tagline,
            .enter,
            .rule i,
            .issue {
                animation: none !important;
                opacity: 1;
                translate: none;
                transform: none;
            }

            .petals {
                display: none;
            }

            /* 静态画面里的套印影子只会显得脏 */
            .title::before {
                display: none;
            }

            .ticket {
                /* 可见性本来由 JS 加 .is-ready 控制，这里要强制显示，
                   否则它会停在透明状态上永远看不见 */
                opacity: 1 !important;
                translate: none !important;
                transition: none !important;
            }

            .ticket-dot,
            .ring-fill {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

<div class="stage">
    <!-- 背景照片 -->
    <div class="bg" id="bg"></div>

    <!-- 压暗层 -->
    <div class="vignette"></div>

    <!-- 网点 -->
    <div class="halftone" aria-hidden="true"></div>

    <!-- 樱花（花瓣由 JS 生成） -->
    <div class="petals" id="petals" aria-hidden="true"></div>

    <!-- 左侧竖排刊号 -->
    <div class="issue" aria-hidden="true">
        <span>VOL.01</span>
        <i></i>
        <span>WN</span>
    </div>

    <!-- 封面正文 -->
    <main class="cover">
        <!-- data-text 是给 CSS ::before 取用的：套印错位的那一层要用同一串字 -->
        <h1 class="title" data-text="夜好眠">夜好眠</h1>

        <div class="rule" aria-hidden="true"><i></i><i></i><i></i></div>

        <p class="tagline">记录、整理与分享</p>

        <!-- 普通访客走这条：不登录，直接看文章 -->
        <a href="/client/main" class="enter" id="enterBtn">
            进入
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </a>
    </main>

    <!-- 右上角：普通用户入口 + 管理员入口。
         文案刻意不同：「登录 / 注册」是访客的，「管理」是站长的。 -->
    <div class="top-entries">
        <a href="/client/auth?back=/client/main" class="entry-pill">登录 / 注册</a>
        <a href="/admin/login" class="entry-pill admin-entry">管理</a>
    </div>

    <!-- 右下角：状态小票。
         数据来自 /client/api/status（公开的脱敏接口），拿不到就整块不显示 ——
         首页不该因为一个装饰性卡片冒出红字。 -->
    <aside class="ticket" id="statusCard" aria-live="polite">
        <div class="ticket-head">
            <i class="ticket-dot"></i>
            <span>RUNNING</span>
        </div>
        <div class="ring">
            <svg viewBox="0 0 100 100" aria-hidden="true">
                <circle class="ring-track" cx="50" cy="50" r="41"></circle>
                <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="41"></circle>
            </svg>
            <span class="ring-num" id="ringPct">--</span>
        </div>
        <div class="ticket-row"><span>UPTIME</span><b id="uptimeText">加载中</b></div>
    </aside>

    <!-- 离场白光 -->
    <div class="flash"></div>
</div>

<script>
    /* ============================================================
       1. 背景图加载完成后淡入
          直接显示背景图会在加载瞬间"啪"地出现，
          先透明、加载完再加 class，观感柔和很多。
       ============================================================ */
    (function initBackground() {
        const bg = document.getElementById('bg');
        const img = new Image();
        img.onload = () => bg.classList.add('loaded');
        // 图片失败也要显示，否则整页是黑的：至少还有底色和文字
        img.onerror = () => {
            bg.classList.add('loaded');
            console.warn('背景图加载失败，请确认文件存在：/client/images/welcome-bg.jpg');
        };
        img.src = '/client/images/welcome-bg.jpg';

        // 已经在缓存里时 onload 可能不触发，补一次
        if (img.complete) {
            bg.classList.add('loaded');
        }
    })();

    /* ============================================================
       2. 樱花
          数量、位置、大小、时长都做成有限随机：
          完全放开会让某些花瓣又大又快，很突兀。

          这一版把数量从 18 降到 12、尺寸从 7~15px 缩到 6~11px、
          时长拉长到 12~26 秒 —— 主视觉已经是封面字，
          花瓣再密就成了抢戏。
       ============================================================ */
    (function initPetals() {
        const container = document.getElementById('petals');
        const COUNT = 12;

        for (let i = 0; i < COUNT; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';

            const size = 6 + Math.random() * 5;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            petal.style.left = (Math.random() * 100) + 'vw';

            // 越小的越快，物理上更像花瓣
            const duration = 12 + (1 - size / 11) * 6 + Math.random() * 8;
            petal.style.animationDuration = duration.toFixed(2) + 's';

            // 负延迟：一开始就散在半空，而不是全部从顶部同时出现
            petal.style.animationDelay = '-' + (Math.random() * duration).toFixed(2) + 's';

            petal.style.setProperty('--drift', (Math.random() * 150 - 45).toFixed(0) + 'px');

            // 308~340 度是一族樱花粉：中心 324 是这套配色的原点
            const hue = 308 + Math.random() * 32;
            petal.style.setProperty('--hue', hue.toFixed(0));

            petal.style.opacity = (0.5 + Math.random() * 0.35).toFixed(2);

            container.appendChild(petal);
        }
    })();

    /* ============================================================
       3. 状态小票
          /client/api/status 是公开的脱敏接口：只有在线、内存占用、
          已运行多久。服务端 15 秒缓存，所以这里 15 秒轮询一次就够，
          再密也拿不到更新的数。
       ============================================================ */
    (function initStatusCard() {
        const card = document.getElementById('statusCard');
        const ringFill = document.getElementById('ringFill');
        const ringPct = document.getElementById('ringPct');
        const uptimeText = document.getElementById('uptimeText');

        if (!card || !ringFill || !ringPct || !uptimeText) {
            return;
        }

        // 和 SVG 里的 r="41" 对应：周长 = 2πr ≈ 257.6
        const CIRCUM = 2 * Math.PI * 41;

        function paint(data) {
            const raw = data.memoryPercent;
            const known = (raw !== null && raw !== undefined && raw >= 0);
            const pct = known ? Math.min(Math.max(raw, 0), 100) : null;

            if (pct === null) {
                // 画成 0% 会让人误以为内存完全空闲，所以显示 "--" 并藏起环
                ringPct.textContent = '--';
                ringFill.style.opacity = '0';
            } else {
                ringPct.textContent = Math.round(pct) + '%';
                ringFill.style.opacity = '1';
                ringFill.style.strokeDashoffset = (CIRCUM * (1 - pct / 100)).toFixed(1);
            }

            uptimeText.textContent = data.uptimeText || '—';
            card.classList.add('is-ready');
        }

        function load() {
            fetch('/client/api/status', { headers: { Accept: 'application/json' } })
                .then(function (res) {
                    if (!res.ok) {
                        throw new Error('HTTP ' + res.status);
                    }
                    return res.json();
                })
                .then(function (body) {
                    // 后端统一包了一层 { code, message, data }
                    if (body && body.data) {
                        paint(body.data);
                    }
                })
                .catch(function () {
                    // 静默失败：小票保持隐藏，控制台留一条便于排查
                    console.warn('首页状态接口未取到数据（可能被博客总开关拦了）');
                });
        }

        load();
        window.setInterval(load, 15000);
    })();

    /* ============================================================
       4. 点击"进入"的过渡
          先播离场动画再跳。720ms 是让白光基本铺满的时刻
          （CSS 里 flash 0.7s、内容淡出 0.5s）。
       ============================================================ */
    (function initEnterTransition() {
        const btn = document.getElementById('enterBtn');
        let navigating = false;      // 防止连点触发两次跳转

        btn.addEventListener('click', function (event) {
            event.preventDefault();

            if (navigating) {
                return;
            }
            navigating = true;

            document.body.classList.add('leaving');

            setTimeout(function () {
                window.location.href = btn.getAttribute('href');
            }, 720);
        });
    })();
</script>

</body>
</html>
