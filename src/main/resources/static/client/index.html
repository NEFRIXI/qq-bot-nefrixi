<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM</title>
    <style>
        /* ============================================================
           欢迎页面 —— 全屏背景 + 樱花飘落 + 入场/离场过渡

           ────────────────────────────────────────────────────────────
           本页的配色、节奏、形态不是拍脑袋定的。
           它们全部由下面这串 108 位随机字母数字串推导而来：

             tVuNQdloNWZkes86uKmsP6Q3XdI23WfUJtoXpcFzU6ughY9QdohyRb
             zAHHMroxJ8zkO4IcqXXzkVIoBfLs6qnn9HnrPElsEKgy6fWY6GusOB

           从这串里读出来的四条线索（每条都对应下面具体的代码）：

           ① 在场六数
              108 位里出现过的数字只有 2 3 4 6 8 9。
              0、1、5、7 一次都没露面 —— 连二进制的 0 和 1 都缺席。
              → 取其中最大的两个定调：
                  9 → 色相 324°（品红）
                  8 → 色相 288°（紫）
                这两个色和背景图的樱花同族，不会跟照片打架。

           ② 节奏 6
              串长 108 = 6 × 18。而数字 6 出现 7 次 ——
              在 62 字符集下，每个字符的期望出现次数是 108 ÷ 62 ≈ 1.74，
              7 次接近期望的 4 倍，是全场出现最多的字符。
              → 页面里的数量、位移、光晕厚度，尽量落在 6 和 18 上。

           ③ 缺位
              0 和 1 的缺席是这串最反直觉的特征。
              → 形态上表现为「断」：分隔线做成三段递减的余音，
                而不是一条连续实线。

           ④ 回声
              全串只有三处相邻双写（位置按字符从 1 数起）：
                HH —— 起于第 57 位
                XX —— 起于第 72 位，正好横跨第 4、5 组的分组边界
                nn —— 起于第 85 位
              → 形态上表现为「错位副本」：标题带一层偏移 6px 的模糊
                重影，按钮悬停时浮出一层错位 6px 的幽灵边框。

           ────────────────────────────────────────────────────────────
           背景图本身（URL、尺寸、位置）与 Ken Burns 呼吸动画
           一个字节都没有改动 —— 它是这个页面的地基。
           新加的紫/品红只出现在背景图「之上」的独立图层里。

           零外部依赖：没有 CDN、没有字体文件、没有图标库。
           所有资源都在本地，断网也能正常显示。
           ============================================================ */

        /* ---------- 基础 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;           /* 全屏页面，禁止滚动条 */
            background: #1a1620;        /* 图片加载前的底色，避免白闪 */
        }

        body {
            font-family: system-ui, -apple-system, "PingFang SC",
                         "Microsoft YaHei", "Segoe UI", sans-serif;
            color: #fff;
        }

        /* ---------- 舞台 ---------- */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* ============================================================
           以下 .bg / .bg.loaded / @keyframes kenBurns 三个区块
           与改动前完全一致，未作任何修改。
           ============================================================ */

        /* ---------- 背景图 ---------- */
        .bg {
            position: absolute;
            inset: 0;
            background-image: url("/client/images/welcome-bg.jpg");
            background-size: cover;
            background-position: center;
            /* 初始略微放大，给 Ken Burns 动画留出位移空间 */
            transform: scale(1.05);
            animation: kenBurns 28s ease-in-out infinite alternate;
            /* 图片加载完成后淡入，避免"啪"地出现 */
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        .bg.loaded {
            opacity: 1;
        }

        /* Ken Burns：极缓慢地放大并轻微平移。
           时长给到 28 秒是有意的——慢了才像"呼吸"，
           快了会变成明显的"缩放动画"，很廉价。 */
        @keyframes kenBurns {
            from {
                transform: scale(1.05) translate(0, 0);
            }
            to {
                transform: scale(1.16) translate(-1.5%, -1%);
            }
        }

        /* ---------- 压暗层（未改动） ---------- */
        /* 两个渐变叠起来：
           左边深 → 保证左侧文字清晰
           底部深 → 让底部内容有依托
           不做成整体压暗，否则会把画面的通透感压没 */
        .vignette {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(100deg,
                    rgba(20, 12, 25, 0.72) 0%,
                    rgba(20, 12, 25, 0.42) 32%,
                    rgba(20, 12, 25, 0.05) 58%,
                    rgba(20, 12, 25, 0) 75%),
                linear-gradient(to top,
                    rgba(20, 12, 25, 0.55) 0%,
                    rgba(20, 12, 25, 0) 40%);
            pointer-events: none;
        }

        /* ---------- 氛围层【新增】 ---------- */
        /* 夹在压暗层之上、文字之下，补上原来没有的画面纵深。
           两个光晕的色相直接取自在场数字：
             右下 84% 80% —— 品红 hsla(324) ← 数字 9
             顶部 58%  6% —— 紫   hsla(288) ← 数字 8

           位置刻意避开左侧文字区（文字在左、垂直居中），
           所以标题的对比度一点没被削弱。

           混合模式用 screen 而不是普通叠加：screen 只提亮、不压暗，
           所以它看起来像"打在照片上的光"，而不是一块糊上去的色斑。
           这是它和 .vignette 的分工 —— 一个负责压，一个负责提。 */
        .atmosphere {
            position: absolute;
            inset: 0;
            pointer-events: none;
            mix-blend-mode: screen;
            background:
                radial-gradient(58% 52% at 84% 80%,
                    hsla(324, 78%, 60%, 0.22) 0%,
                    hsla(324, 78%, 60%, 0) 68%),
                radial-gradient(50% 44% at 58% 6%,
                    hsla(288, 66%, 58%, 0.15) 0%,
                    hsla(288, 66%, 58%, 0) 70%);
            /* 呼吸周期取 18 秒 —— 串的分组长度（108 ÷ 6）。
               只动 transform，不动 opacity：opacity 要留给离场动画用，
               被 keyframes 占用的话 body.leaving 就改不动它了。 */
            animation: breathe 18s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.07);
            }
        }

        /* ---------- 樱花 ---------- */
        .petals {
            position: absolute;
            inset: 0;
            pointer-events: none;       /* 花瓣不能挡住按钮点击 */
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -8%;
            /* 花瓣形状：两个对角圆角 = 一片花瓣 */
            border-radius: 100% 0 100% 0;
            /* 色相由 JS 逐片注入（308~340），这里 324 只是兜底值 ——
               324 正是数字 9 的色相，也就是这串里最大的数字。
               三段用同一个色相、只是依次压暗：这样每片花瓣内部
               自己有一个"被光照到"的明暗过渡，而不是一整片死粉。
               （不用 calc 调色相，是因为没必要为这点差异引入一个
                 可能不被老引擎解析的表达式。） */
            background: linear-gradient(135deg,
                hsl(var(--hue, 324), 100%, 93%) 0%,
                hsl(var(--hue, 324), 94%, 80%) 55%,
                hsl(var(--hue, 324), 88%, 68%) 100%);
            opacity: 0.85;
            /* 用 will-change 提示浏览器提前升到合成层，
               十几片同时飘的时候能明显减少卡顿 */
            will-change: transform;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* 飘落：一边往下一边左右摆动，同时自转，
           三个变换叠加起来才像花瓣而不是"掉下来的方块" */
        @keyframes fall {
            0% {
                transform: translate3d(0, 0, 0) rotate(0deg);
                opacity: 0;
            }
            8% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.85;
            }
            100% {
                transform: translate3d(var(--drift, 60px), 115vh, 0) rotate(540deg);
                opacity: 0;
            }
        }

        /* ---------- 内容 ---------- */
        .content {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* 靠左留出 8vw：背景图右侧是人物，文字放左边互不干扰 */
            padding: 0 8vw;
            max-width: 780px;           /* 780 = 6 × 130 */
        }

        /* ---------- 标题 + 回声 ---------- */
        /* 标题和它的重影必须在字号、字重、字距上完全一致，
           否则重影会从文字里"漏"出来。所以这三条共用一个规则块。 */
        .title-wrap,
        .title,
        .title-echo {
            font-size: clamp(3.4rem, 9vw, 7rem);
            font-weight: 200;
            /* 字距 0.18em —— 0.18 就是串的分组长度 18 */
            letter-spacing: 0.18em;
            line-height: 1;
        }

        .title-wrap {
            position: relative;
            /* 收缩到文字宽度，否则 h1 会撑满 780px，
               渐变的品红/紫段就跑到了文字右边之外，看不见了 */
            width: fit-content;
            align-self: flex-start;
            opacity: 0;
            animation: riseIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
        }

        .title {
            position: relative;
            z-index: 1;
            /* 从纯白渐到品红再收进紫，比整片死白多一层材质。
               两端色相还是 324 和 288 —— 在场数字 9 和 8。 */
            background: linear-gradient(96deg,
                #ffffff 0%,
                #ffffff 38%,
                hsl(324, 88%, 90%) 74%,
                hsl(288, 80%, 84%) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            /* background-clip: text 之后 text-shadow 会失效 ——
               它是画在文字底下的，而文字已经是透明的了。
               所以发光改用 drop-shadow：它按渲染后的不透明像素算，
               透明文字配它正好。 */
            filter:
                drop-shadow(0 0 20px hsla(324, 88%, 72%, 0.40))
                drop-shadow(0 4px 24px rgba(0, 0, 0, 0.50));
        }

        /* 选中标题时给个看得见的高亮，否则透明文字配默认高亮会糊成一片 */
        .title::selection {
            background: hsla(324, 88%, 68%, 0.45);
            color: #fff;
        }

        /* 回声层 —— 对应串里那三处相邻双写（HH / XX / nn）。
           偏移量 6px 是节奏 6；模糊 11px 让它只留"影子"的浓度，
           不至于变成第二个标题跟主标题抢。 */
        .title-echo {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 0;
            color: hsla(324, 92%, 74%, 0.5);
            filter: blur(11px);
            pointer-events: none;
            user-select: none;
            opacity: 0;
            animation: echoIn 1.3s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
        }

        /* 回声不是"同时出现"，是"追上来"。
           所以它比主标题晚 0.2 秒起步，而且从更远的 (14,10) 收拢到 (6,5)。 */
        @keyframes echoIn {
            from {
                opacity: 0;
                transform: translate(14px, 10px);
            }
            to {
                opacity: 1;
                transform: translate(6px, 5px);
            }
        }

        /* ---------- 分隔线【改为三段】 ---------- */
        /* 原来是一条 92px 的连续渐变线。
           改成三段递减（44 / 26 / 10）是因为「缺位」这条线索：
           0 和 1 不在场，形态上就该是「断」的。
           三段长度递减，读起来像余音 —— 也正好对上串里那三处双写。 */
        .divider {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 1.6rem 0 1.5rem;
            opacity: 0;
            transform-origin: left center;
            animation: lineGrow 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
        }

        .divider i {
            display: block;
            height: 1px;
            flex: 0 0 auto;
        }

        .divider i:nth-child(1) {
            width: 44px;
            background: linear-gradient(90deg,
                hsla(324, 95%, 82%, 0.95), hsla(324, 95%, 82%, 0.5));
        }

        .divider i:nth-child(2) {
            width: 26px;
            background: linear-gradient(90deg,
                hsla(310, 88%, 80%, 0.5), hsla(300, 84%, 78%, 0.3));
        }

        .divider i:nth-child(3) {
            width: 10px;
            background: hsla(288, 82%, 78%, 0.28);
        }

        .subtitle {
            font-size: clamp(0.9rem, 1.6vw, 1.05rem);
            font-weight: 300;
            letter-spacing: 0.16em;
            line-height: 1.9;
            /* 白里掺一点点品红，和标题的渐变收尾同族 */
            color: hsla(324, 62%, 96%, 0.9);
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
            opacity: 0;
            animation: riseIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.75s forwards;
        }

        /* ---------- 进入按钮 ---------- */
        .enter {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 168px;               /* 168 = 6 × 28 */
            height: 54px;               /* 54 = 6 × 9（改动前是 52） */
            margin-top: 2.8rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            /* 直角 → 胶囊。999px 是个会被浏览器收敛到"高度的一半"的写法
               （54 ÷ 2 = 27px），所以两端正好是正圆弧，不会圆过头。
               不写死 27px 是因为窄屏和以后调高度时它会自己跟着变。
               整体轮廓仍然是矩形，只是两端圆了。 */
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(3px);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.42em;
            text-decoration: none;
            /* 用 padding 偏移抵消 letter-spacing 造成的视觉不居中 */
            padding-left: 0.42em;
            cursor: pointer;
            overflow: hidden;
            opacity: 0;
            animation: riseIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.95s forwards;
            transition: border-color 0.4s ease, box-shadow 0.4s ease,
                        transform 0.4s ease, background-color 0.4s ease;
        }

        /* 悬停时白光从左侧扫过 */
        .enter::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 120%;
            height: 100%;
            background: linear-gradient(100deg,
                transparent, rgba(255, 255, 255, 0.28), transparent);
            transition: left 0.7s ease;
        }

        .enter:hover::before {
            left: 120%;
        }

        /* 悬停时出现三层东西，从内到外：
             0 0 0 6px  —— 一圈 6px 的柔光，节奏 6
             6px 6px 0  —— 错位 6px 的幽灵边框，这是「回声」的形态
             0 0 26px   —— 外发光，让按钮从背景里浮起来
           幽灵边框用 blur 0、spread -1px，所以它是一道有棱的边，
           不是一个光斑 —— 它要和按钮自己的实边框形成"一实一虚"的对照。 */
        .enter:hover {
            border-color: hsla(324, 95%, 84%, 0.95);
            background: hsla(324, 90%, 66%, 0.16);
            box-shadow:
                0 0 0 6px hsla(324, 95%, 84%, 0.10),
                6px 6px 0 -1px hsla(288, 85%, 76%, 0.22),
                0 0 26px hsla(324, 92%, 72%, 0.45),
                inset 0 0 22px hsla(324, 92%, 72%, 0.16);
            transform: translateY(-2px);
        }

        .enter:active {
            transform: translateY(0) scale(0.98);
        }

        /* ---------- 左侧刻度【新增】 ---------- */
        /* 六根短线的长度 = 数字 × 3px，
           顺序是这些数字在随机串里「首次出现」的先后：

             数字   8    6    3    2    9    4
             首次   第15 第16 第24 第28 第47 第68  位
             长度   24   18    9    6   27   12   px

           这个序列不是我排的，是从串里数出来的。
           它参差、不规整 —— 但六根线摆在一起自然成一段节奏。
           观众不必知道含义，看不懂也不影响；看得懂的人会看到那串码。

           右端对齐（align-items: flex-end），所以右边是一条整齐的
           基准线，左端像声波一样散开。 */
        .spine {
            position: absolute;
            left: 4.4vw;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 14px;
            pointer-events: none;
            opacity: 0;
            animation: fadeIn 1.2s ease 1.5s forwards;
        }

        .spine i {
            display: block;
            height: 1px;
            /* 从左到右由虚到实：把参差的左端软化掉，
               让右端那条基准线成为视觉锚点 */
            background: linear-gradient(90deg,
                hsla(324, 92%, 82%, 0.05),
                hsla(324, 92%, 82%, 0.42));
        }

        .spine i:nth-child(1) { width: 24px; }
        .spine i:nth-child(2) { width: 18px; }
        .spine i:nth-child(3) { width: 9px; }
        .spine i:nth-child(4) { width: 6px; }
        .spine i:nth-child(5) { width: 27px; }
        .spine i:nth-child(6) { width: 12px; }

        /* ---------- 右下角签名【新增】 ---------- */
        /* 108 = 串长，也是 6 × 18。
           页面里所有"6 的节奏"最终都归到这个数上，
           所以把它露在明面上，当作这版设计的种子编号。
           偏移 6vh、字距 0.34em、透明度 0.24 —— 全是压低存在感的参数，
           它应该在余光里，不在视线中心。 */
        .seed {
            position: absolute;
            right: 6vh;
            bottom: 6vh;
            font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono",
                         Consolas, monospace;
            font-size: 0.62rem;
            letter-spacing: 0.34em;
            color: rgba(255, 255, 255, 0.24);
            pointer-events: none;
            user-select: none;
            opacity: 0;
            animation: fadeIn 1.4s ease 1.8s forwards;
        }

        /* ---------- 入场动画 ---------- */
        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(26px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes lineGrow {
            from {
                opacity: 0;
                transform: scaleX(0);
            }
            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ---------- 点击"进入"后的离场动画 ---------- */
        /* 三个层次分别动，做出"镜头推进"的感觉：
             背景继续放大并轻微失焦
             文字整体上浮淡出
             一层白光从中间扩散，把画面盖住 */
        body.leaving .bg {
            transition: transform 0.85s cubic-bezier(0.4, 0, 0.6, 1),
                        filter 0.85s ease;
            transform: scale(1.3);
            filter: blur(7px) brightness(1.35);
        }

        body.leaving .content {
            transition: opacity 0.5s ease, transform 0.7s cubic-bezier(0.4, 0, 0.6, 1);
            opacity: 0;
            transform: translateY(-38px) scale(0.97);
        }

        body.leaving .petals {
            transition: opacity 0.6s ease;
            opacity: 0;
        }

        /* 新加的两层也一起退场，否则白光铺满时它们还挂在上面 */
        body.leaving .spine,
        body.leaving .seed {
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        body.leaving .atmosphere {
            transition: opacity 0.6s ease;
            opacity: 0;
        }

        /* 白光也从粉白收进紫 —— 和氛围层用的是同一对色相 */
        .flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%,
                rgba(255, 244, 251, 1) 0%,
                hsla(324, 96%, 86%, 0.88) 34%,
                hsla(288, 88%, 78%, 0) 74%);
            opacity: 0;
            transform: scale(0.35);
            pointer-events: none;
        }

        body.leaving .flash {
            transition: opacity 0.75s ease, transform 0.75s cubic-bezier(0.4, 0, 0.6, 1);
            opacity: 1;
            transform: scale(2.6);
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 720px) {
            .content {
                /* 窄屏时图片两侧会被裁掉，人物可能跑到中间，
                   所以改成整体居中 + 更强的压暗，保证文字始终可读 */
                padding: 0 8vw;
                max-width: none;
                align-items: center;
                text-align: center;
            }

            .vignette {
                background:
                    linear-gradient(to bottom,
                        rgba(20, 12, 25, 0.55) 0%,
                        rgba(20, 12, 25, 0.35) 45%,
                        rgba(20, 12, 25, 0.62) 100%);
            }

            /* 窄屏左边没有空间容下这六根线，直接隐去。
               它本来就是"余光里的东西"，少一层不影响主体。 */
            .spine {
                display: none;
            }

            /* 基础规则里 .title-wrap 是 flex-start（为了收缩到文字宽度），
               窄屏要改回居中 */
            .title-wrap {
                align-self: center;
            }

            .enter {
                width: 150px;
                align-self: center;
            }

            .seed {
                right: 6vw;
                bottom: 4vh;
                font-size: 0.56rem;
            }
        }

        /* ---------- 尊重系统的"减少动态效果"设置 ---------- */
        /* 有些人会因为前庭功能问题对动效不适，系统里开了这个开关。
           关掉动画不影响功能，只是画面静止。 */
        @media (prefers-reduced-motion: reduce) {
            .bg,
            .petal,
            .title-wrap,
            .divider,
            .subtitle,
            .enter,
            .seed,
            .atmosphere {
                animation: none !important;
                opacity: 1;
                transform: none;
            }

            /* .spine 的 translateY(-50%) 是拿来做垂直居中的定位，
               不是装饰，不能被上面的 transform: none 清掉。
               所以它单独处理。 */
            .spine {
                animation: none !important;
                opacity: 1;
            }

            /* 静态画面里，重影只会显得脏 */
            .title-echo {
                display: none;
            }

            .petals {
                display: none;
            }
        }
        /* ---------- 右上角的登录入口 ---------- */
        /* 只有管理员会用到，普通访客那条路上不该出现"登录"这个动作，
           所以它做得很轻：小字号、半透明、描边胶囊，放在角落。
           不知道有后台的人根本不会注意到它。
           颜色用中性白而不是主题色，是为了不跟主视觉的"进入"按钮抢注意力。 */
        .admin-entry {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 50;                /* 浮在所有图层之上 */
            padding: 6px 16px;
            font-size: 13px;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.42);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            transition: color .35s ease, border-color .35s ease, background .35s ease;
        }

        .admin-entry:hover {
            color: rgba(255, 255, 255, 0.92);
            border-color: rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.06);
        }

    </style>
</head>
<body>

<div class="stage">
    <!-- 背景图 -->
    <div class="bg" id="bg"></div>

    <!-- 压暗层，保证文字可读 -->
    <div class="vignette"></div>

    <!-- 氛围层：紫/品红的光，只提亮不压暗 -->
    <div class="atmosphere"></div>

    <!-- 樱花容器，花瓣由 JS 生成 -->
    <div class="petals" id="petals"></div>

    <!-- 左侧刻度：六根短线的长度 = 数字 × 3px，
         顺序是这些数字在随机串里首次出现的先后：
         8(第15位) 6(第16位) 3(第24位) 2(第28位) 9(第47位) 4(第68位)
         对应 24px / 18px / 9px / 6px / 27px / 12px
         看不懂也不影响观感，它先是六根线，然后才是一串数据。 -->
    <div class="spine" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <!-- 正文 -->
    <main class="content">
        <div class="title-wrap">
            <!-- 回声层：纯粹的重影，屏幕阅读器跳过 -->
            <span class="title-echo" aria-hidden="true">夜好眠</span>
            <h1 class="title">夜好眠</h1>
        </div>

        <div class="divider" aria-hidden="true">
            <i></i><i></i><i></i>
        </div>

        <!-- 这里换成你自己的网站定位，一行字就够 -->
        <p class="subtitle">
            记录、整理与分享
        </p>

        <!-- 普通访客走这条：不登录，直接看文章 -->
        <a href="/client/main" class="enter" id="enterBtn">进入</a>
    </main>

    <!-- 右上角：管理员入口。
         普通访客那条路上不该出现"登录"这个动作，所以它做得很轻、
         放在角落里，不知道有后台的人不会注意到它。 -->
    <a href="/admin/login" class="admin-entry">登录</a>

    <!-- 右下角签名：串长 108，也就是 6 × 18 -->
    <p class="seed" aria-hidden="true">SEED 108</p>

    <!-- 离场时的白光 -->
    <div class="flash"></div>
</div>

<script>
    /* ============================================================
       1. 背景图加载完成后淡入
          直接在 CSS 里显示背景图会在加载的瞬间"啪"地出现，
          先透明、加载完再加 class，观感会柔和很多。
       ============================================================ */
    (function initBackground() {
        const bg = document.getElementById('bg');
        const img = new Image();
        img.onload = () => bg.classList.add('loaded');
        // 图片加载失败也要显示（否则整个页面是黑的），
        // 这时至少还有渐变底色和文字
        img.onerror = () => {
            bg.classList.add('loaded');
            console.warn('背景图加载失败，请确认文件存在：' +
                '/client/images/welcome-bg.jpg');
        };
        img.src = '/client/images/welcome-bg.jpg';

        // 如果图片已经在缓存里，onload 可能不会触发，补一次
        if (img.complete) {
            bg.classList.add('loaded');
        }
    })();

    /* ============================================================
       2. 生成樱花
          数量、位置、大小、时长都做成随机，避免看出"复读"的规律。
          但随机是有限的随机（见各处的取值范围），
          完全放开会让某些花瓣又大又快，很突兀。

          这里有两处按随机串调过：
            · 数量 16 → 18（18 = 108 ÷ 6，串的分组长度）
            · 颜色不再是一片死粉，逐片在 308~340 度色相里浮动
       ============================================================ */
    (function initPetals() {
        const container = document.getElementById('petals');

        // 花瓣数量：18 片 = 108 ÷ 6。
        // 改动前是 16。改成 18 是因为随机串长 108、分组长度正好 18，
        // 而 6 是串里出现最多的数字（7 次），数量落在这组数上更"有出处"。
        // 再多就开始吃性能，再少显得空。
        const COUNT = 18;

        for (let i = 0; i < COUNT; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';

            // 大小 7~15px
            const size = 7 + Math.random() * 8;
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';

            // 横向起始位置：0~100%（用 vw 保证和视口宽度对应）
            petal.style.left = (Math.random() * 100) + 'vw';

            // 每片花瓣的下落时长 9~20 秒，越小的越快（物理上更像花瓣）
            const duration = 9 + (1 - size / 15) * 6 + Math.random() * 5;
            petal.style.animationDuration = duration.toFixed(2) + 's';

            // 负延迟：让它们一开始就散落在半空中，
            // 而不是全部从顶部同时出现（那样第一秒会很假）
            petal.style.animationDelay = '-' + (Math.random() * duration).toFixed(2) + 's';

            // 左右飘移量，作为 CSS 变量传给 keyframes
            petal.style.setProperty('--drift', (Math.random() * 150 - 45).toFixed(0) + 'px');

            // 色相在 308~340 度之间逐片浮动。
            // 区间中心 324 正是数字 9 的色相（这串里最大的数字），
            // 上下各留 16 度 —— 保证整体是一族樱花粉，
            // 又不会粉得像复制粘贴。
            const hue = 308 + Math.random() * 32;
            petal.style.setProperty('--hue', hue.toFixed(0));

            // 轻微随机透明度，让层次丰富些
            petal.style.opacity = (0.55 + Math.random() * 0.4).toFixed(2);

            container.appendChild(petal);
        }
    })();

    /* ============================================================
       3. 点击"进入"的过渡
          不是直接跳转，而是先播放一段离场动画再走。
          这里的关键是：延迟时间要和 CSS 里 .leaving 的动画时长对得上
          （CSS 里 flash 是 0.75s、内容淡出 0.5s），
          取 720ms 是让白光基本铺满时再切页，观感最连贯。
       ============================================================ */
    (function initEnterTransition() {
        const btn = document.getElementById('enterBtn');
        let navigating = false;     // 防止连点触发两次跳转

        btn.addEventListener('click', function (event) {
            // 先拦住默认跳转，等动画播完再手动跳
            event.preventDefault();

            if (navigating) {
                return;
            }
            navigating = true;

            document.body.classList.add('leaving');

            setTimeout(function () {
                window.location.href = btn.getAttribute('href');
            }, 720);
        });
    })();
</script>

</body>
</html>
