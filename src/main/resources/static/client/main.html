<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 · WN</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="description" content="全部文章：按时间排列的篇目表。">
    <meta name="theme-color" content="#0B0A12">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/main.css">
</head>

<!-- data-page 告诉 main.js 当前是哪个页面，它据此决定跑哪段逻辑 -->
<body data-page="list">

<!-- ==================== 左侧：曲目册 ====================
     它是"一册曲目"，不是播放器：卡片上有编号、曲名、年份。
     卡片由 main.js 填进 #musicTrack；歌单来自项目根的 music/list.json，
     取不到时用 main.js 里的 DEFAULT_MUSIC_LIST 兜底。

     这一栏通高、不跟着右边书页滚 —— 滚动权在 .page-main 手里。
     鼠标移进来时走纸会停（纯 CSS），停住才挑得到歌。 -->
<aside class="music-rail">
    <p class="rail-head">CURATED<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="17" r="3.2"/><rect x="10.2" y="3" width="1.8" height="14"/><path d="M12 3.4 L18.4 5.6 L18.4 9.8 L12 7.6 Z"/></svg></p>
    <div class="track" id="musicTrack"></div>
</aside>

<!-- ==================== 右侧：书页 ==================== -->
<div class="page-main">

    <!-- 阅读进度：滚动时从左往右长出来，宽度就是读完的比例。
         fixed 定位钉在书页顶端，不跟内容走 -->
    <div class="read-progress" id="readProgress"></div>

    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="/client">
                <span class="brand-dot"></span>
                WN
            </a>
            <nav class="topbar-links">
                <a href="/client/main" class="is-active">文章</a>
                <a href="/client/post">写文章</a>
                <a href="/client">首页</a>
                <!-- 用户登录状态由 user.js 填这里：
                     未登录显示"登录"，已登录显示"昵称 + 退出" -->
                <span class="topbar-user-box" id="userBox"></span>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-head">
            <h1>文章</h1>
            <p>记录、整理与分享</p>
            <!-- 三段递减的分隔线：这套版式的记号，表示"这句话说完了" -->
            <div class="head-divider" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>

        <!-- 列表内容由 main.js 填进来。这里保持空着，
             而不是写一堆占位 HTML 再被替换掉 -->
        <div class="post-list" id="listBox"></div>

        <!-- 翻页条 -->
        <div id="pagerBox"></div>
    </main>

    <footer class="site-foot container">
        <p>WN · 个人站点</p>
    </footer>

</div>

<!-- 播放控制条：只在列表页有这几个节点。
     .rail-ctrl 自己是 display:flex，[hidden] 在 CSS 里被显式写回 none。 -->
<div class="rail-ctrl" id="railCtrl" hidden>
    <span class="rail-ctrl-name" id="railCtrlName">未在播放</span>
    <button class="rail-ctrl-btn" id="railCtrlBtn" type="button" aria-label="播放或暂停">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script src="/js/common.js"></script>
<script src="/js/main.js"></script>
<script src="/js/user.js"></script>
</body>
</html>
