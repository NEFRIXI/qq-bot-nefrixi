# ============================================================
# mybotweb 主配置文件
#
# 分工约定（重要）：
#   application.yml        → 提交到 git，只放"模板"和公共配置，不放任何密钥
#   application-local.yml  → 本机专用，放 AppSecret / API Key，已被 .gitignore 忽略
#                            通过下面的 spring.profiles.active: local 自动加载
# ============================================================

server:
  # 服务端口，浏览器和 curl 都访问这个端口
  port: 8080

spring:
  application:
    # 应用名，会出现在日志和监控里
    name: mybotweb
  profiles:
    # 激活 local 环境 → 额外加载 application-local.yml
    # 这个文件里有真实凭证，不提交到 git
    active: local
  jackson:
    # 序列化 JSON 时，日期统一用这个格式，且用东八区时间
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# ============================================================
# 以下是本项目自定义的配置，统一挂在 app 前缀下。
# 全部由 com.mybotweb.config.AppProperties 读取，不散落在各处用 @Value。
# ============================================================
app:

  # ----------------------------------------------------------
  # ★ 角色标记 —— 这个值决定「用哪套大模型算力」
  #
  # 判断依据是"这段代码跑在哪台机器上"：
  #
  #   local（默认）
  #       用本机 WSL 里的 Ollama。免费、不限量。
  #       适合：在你自己的电脑上跑。
  #
  #   cloud
  #       调云端 API（DeepSeek）。按 token 计费。
  #       适合：在云服务器上跑 —— 那里没有 Ollama 可以连。
  #
  #   mock
  #       不连任何模型，直接把用户说的话回声回去。
  #       适合：只验证消息链路，既不想装模型也不想花钱。
  #
  # 部署到云服务器时改成 cloud，同时填好下面的 llm.cloud.api-key。
  # 也可以用环境变量覆盖，部署时更方便、不用改文件：APP_ROLE=cloud
  #
  # 【当前默认值为什么是 cloud】
  # 这份配置主要用于云服务器部署 —— 云端没有 Ollama 可以连，所以默认走 API。
  # 若要在本机用本地模型跑，有两种方式：
  #   1. 临时改这里为 local
  #   2. 启动时用环境变量覆盖（推荐，不污染文件）：
  #        Windows PowerShell:  $env:APP_ROLE="local"; mvn spring-boot:run
  # ----------------------------------------------------------
  role: cloud

  # ----------------------------------------------------------
  # 本地 Ollama 的进程管理（供 /setlocal 命令使用）
  #
  # 【为什么需要这个】
  # 本地模型（WSL 里的 Ollama）有时会没起来或挂掉，表现是聊天回
  # "我这边的本地模型好像没跑起来"。人工去 WSL 里敲命令很麻烦，
  # 所以提供 /setlocal 命令一键重启。
  #
  # 只在本机（Windows）跑时才有意义；云服务器上没有 Ollama，
  # 那条命令会明确告诉你"当前环境不支持"。
  # ----------------------------------------------------------
  local-ollama:

    # 是否允许 /setlocal 命令执行重启操作。
    # 关掉之后 /setlocal 只做"查看状态"，不会真的去杀进程、起进程。
    manage-enabled: true

    # WSL 发行版名称。用 `wsl -l -v` 可以列出本机有哪些。
    wsl-distro: Ubuntu-20.04

    # 在 WSL 里执行的重启命令。OLLAMA_HOST 必须绑定 0.0.0.0，
    # 否则 Windows 侧通过 localhost:11434 访问不到（WSL2 的转发只对
    # 非回环绑定生效）。这是本机跑 Ollama 最常见的坑。
    restart-command: "export OLLAMA_HOST=0.0.0.0:11434; pkill -f 'ollama serve'; sleep 1; nohup ollama serve > /tmp/ollama.log 2>&1 & sleep 3; echo started"

    # 重启后等待多久（秒）再验证端口是否恢复
    verify-wait-seconds: 5

  # ----------------------------------------------------------
  # ★ 算力路由 —— 决定「这一条消息交给谁算」
  #
  # 【它和 app.role 的区别，这是最容易搞混的一处】
  #   app.role           启动时决定"这台机器的主算力是谁"，是部署事实
  #   app.route.strategy 运行期决定"这一条消息用谁"，是策略，可改
  #
  # 组合示例：云服务器上 role: cloud（它自己只会调 API），
  # 但 strategy: LOCAL_FIRST（有本地节点在线时优先派给它算）——
  # 这两个合起来才是"云服务器当路由器"的形态。
  #
  # 四种策略（对应 RouteStrategy 枚举）：
  #   LOCAL_FIRST  本地优先：本地在线走本地，离线自动降级云端（默认，最省钱）
  #   CLOUD_FIRST  云端优先：不管本地在不在都走云端
  #   LOCAL_ONLY   仅本地：本地离线直接报错，绝不产生云端费用
  #   CLOUD_ONLY   仅云端：只用云端大模型
  #
  # 运行期可以用 /strategy 命令改（仅管理员），改的是内存状态，
  # 重启后回到这个配置值。
  # ----------------------------------------------------------
  route:

    strategy: LOCAL_FIRST

    # 判定本地节点离线的静默时长（秒）。
    # 心跳间隔的 3 倍是常规取法：留出两次丢包的容忍空间。
    # 太灵敏 → 网络抖动被误判成离线，消息甩去云端白花钱；
    # 太迟钝 → 本地真挂了还往本地派，用户一直等不到回复。
    local-node-timeout-seconds: 45

    # 本地节点心跳间隔（秒）。本地端实现时要和这个值对齐。
    heartbeat-interval-seconds: 15

  # ----------------------------------------------------------
  # ★ 热聊模式 —— 主动搭话（用 /c_hot 命令开关）
  #
  # 【它和默认模式的区别】
  #   默认（被动）：有人对机器人说话才回答
  #   热聊（主动）：群里几个人在聊，机器人自己判断要不要插一句
  #
  # 【提示词是怎么拼的 —— 这是本模式的核心设计】
  #   最终 System Prompt = 人设（/model-p 选的那个，或按身份自动选）
  #                      + app.hot-chat.prompt-file 的内容
  #   两段分工：
  #     人设      → 机器人"是谁"（语气、性格、身份），用 /model-p 随时换
  #     搭话提示词 → 这个场合"怎么说话"（怎么看上下文、何时插话）
  #   所以换人设不用碰搭话提示词，改搭话规则也不用碰人设文件。
  #
  # 【成本警告】
  #   热聊会让 API 调用量跟着群活跃度走。下面两个节流参数是防烧钱的关键，
  #   调小时请想清楚：群里一热闹，每次触发都是一次真实的模型调用。
  # ----------------------------------------------------------
  hot-chat:

    # 每个会话保留的上下文条数（滑动窗口上限）。
    #
    # 【这是"动态缓冲"的封顶值】消息一条条进来，缓冲从 0 涨到这里，
    # 之后就固定为"最近 N 条"——新消息把最老的挤出去。
    # 所以它同时决定了两件事：占多少内存、每次搭话带多少上下文。
    #
    # 【为什么是 10】热聊的上下文只用来回答一个问题："大家在聊什么、要不要接一句"。
    # 3 条只能看见"最后三句"，看不出话题是从哪儿来的；10 条大约是一轮完整对话的长度，
    # 足够模型判断"这个话题我有没有可说的"，同时把每次搭话的上下文控制在
    # 约 300 token（中文 1 字 ≈ 1 token），对本地 7B 来说 prefill 只要一两秒。
    #
    # 【再往上调的代价是线性的】20 条会让上下文翻倍、prefill 时间翻倍，
    # 而理解力提升很小——热聊不需要"记得很久以前说过什么"。
    max-messages: 10

    # 距上次搭话后，群里至少再积累多少条消息才允许搭话。
    # 第一道闸：防止群友只说半句话机器人就抢着接。
    min-messages: 3

    # 两次搭话的最小间隔（秒）。
    # 第二道闸：群聊节奏快时，只有条数限制拦不住刷屏——
    # 十几秒就能攒够三条。
    min-interval-seconds: 60

    # 主动搭话时附加的提示词文件（不含 .md，放在 SysPrompt/ 下）。
    prompt-file: chat_hot

    # 机器人判断"这次不用我说话"时输出的标记，程序看到就不发送消息。
    # 【改这里必须同步改提示词文件里的说明】，两边不一致会导致机器人对什么都沉默。
    silent-token: "[沉默]"

    # 上下文里代表机器人自己的称呼（历史发言会标成 【我】xxx）。
    bot-self-label: "我"

    # 是否只对群聊生效。单聊里"多方发言"这个概念不成立，开了只会让
    # 机器人对没问的事也自顾自说话，所以默认只对群聊开。
    group-only: true

  # ----------------------------------------------------------
  # 消息通道类型
  #   mock = 本地 HTTP 调试入口，不需要腾讯凭证，用来验证整条处理链路
  #   qq   = 真实的腾讯 QQ WebSocket 网关
  # 两个实现类上都标了 @ConditionalOnProperty，改这里就能切换，
  # 不用改任何 Java 代码。
  # ----------------------------------------------------------
  channel:
    type: qq

  # ----------------------------------------------------------
  # QQ 开放平台凭证
  # AppID 不是秘密，可以直接写在这里；
  # AppSecret 是密码，写在 application-local.yml 里。
  # ----------------------------------------------------------
  qq:
    app-id: "1905783650"
    # 默认取环境变量 QQ_APP_SECRET，取不到就是空串。
    # 更推荐的做法是在 application-local.yml 里直接赋值。
    app-secret: ${QQ_APP_SECRET:}
    # OpenAPI 基础地址（官方文档里的"统一地址"）
    base-url: https://api.bot.qq.com
    # 开发阶段连的是沙箱环境（沙箱里的机器人只对沙箱成员响应）
    sandbox: true
    # 事件订阅掩码（intents）：告诉腾讯"我要收哪些类型的事件"。
    # 33554432 = 1 << 25 = GROUP_AND_C2C_EVENT，包含：
    #   C2C_MESSAGE_CREATE       用户单聊发消息给机器人  ← 我们要的
    #   GROUP_AT_MESSAGE_CREATE  用户在群里@机器人       ← 我们要的
    #
    # 【警告】这个值配错的表现是"机器人连上了但永远不理你"，而且不报错。
    # 别用 513 —— 那是官方文档里"接收频道at消息"的示例值，跟单聊无关。
    intents: 33554432

  # ----------------------------------------------------------
  # 大模型配置
  #
  # 【两段都会被读进来】—— 两个客户端是同时装配的，
  # 每次聊天由 route/ModelRouter 按 app.route.strategy 现算用哪个。
  #
  # 所以这里不是"role 选一段、另一段忽略"：
  #   · 两段可以同时填好，差别只在于"哪一段真的被调用"
  #   · app.role 已经不参与这个选择了（它只管 /status 的显示）
  #
  # 想让本地优先：app.route.strategy: LOCAL_FIRST（默认，本地不可用时降级云端）
  # 想绝不花钱：  app.route.strategy: LOCAL_ONLY（本地不可用时明确报错）
  # ----------------------------------------------------------
  llm:

    # ---- 本地模型：Ollama，跑在 WSL 中 ----
    ollama:
      # WSL2 会把 WSL 里的监听端口转发到 Windows 的 localhost。
      # 前提是 Ollama 绑定了 0.0.0.0（默认只绑 127.0.0.1，那样 Windows 连不上），
      # 启动 Ollama 前需要设置环境变量 OLLAMA_HOST=0.0.0.0
      base-url: http://localhost:11434

      # 启动时默认使用哪个模型。
      #
      # 【必须和 ollama list 输出的名字完全一致】
      # 不确定填什么也没关系：先随便填一个，启动后在 QQ 里发 /model，
      # 它会直接问 Ollama 本机有哪些模型并列出来，照着复制即可。
      model: qwen2.5:7b

      # 【可选】限制能切换到哪些模型。
      #
      # 留空（默认）= 不限制。这时 /model 会列出 Ollama 里所有已下载的模型，
      #              想切哪个切哪个；新下载的模型立刻可见，不用改配置重启。
      #
      # 配了清单  = 只允许切换到清单内的模型。
      #            适合"防止误切到某个特别慢的模型"这种情况。
      #
      # 注意：清单只是额外限制。真正决定"能不能切"的是
      # Ollama 里到底有没有那个模型——没有的话 /model 会明确告诉你。
      available-models: []

      # ----------------------------------------------------------
      # 模型简写别名：key 是简写，value 是完整模型名
      #
      # 为什么需要：本地模型的完整名字可能长得离谱，比如
      #   R4C3R/minicpm5-1b-fable5-heretic:q4_k_m
      # 这一串在手机上根本打不错才怪。配了别名之后，
      # /model 列表会同时显示完整名和简写，两种都能用来切换。
      #
      # 你新下载模型后，用 /model 看到完整名，再回来加一行别名即可。
      # ----------------------------------------------------------
      model-aliases:
        q7b: qwen2.5:7b
        m1b-r: R4C3R/minicpm5-1b-fable5-heretic:q4_k_m
        q3b-r: R4C3R/qwen2.5-3b-heretic:latest

      # 本地小模型出字慢，超时给宽松一点
      timeout-seconds: 120

    # ---- 云端模型：在云服务器上跑时使用（app.role = cloud）----
    cloud:
      # 接口地址。DeepSeek 用的是 OpenAI 兼容格式，
      # 所以换成别家（通义、Kimi 等）只要也兼容，改这一行就行
      base-url: https://api.deepseek.com

      # API Key。这是要花钱的凭证，绝对不能提交到 git。
      # 【这里只写占位符】真实密钥填在 application-local.yml 里（该文件被
      # .gitignore 忽略，且已由 spring.profiles.active=local 自动加载）；
      # 也可以用环境变量 LLM_API_KEY 覆盖 —— 部署时更省事。
      # 两者都没有时它是空串，CloudChatModelClient 会判为"没配"并在启动
      # 日志里明确打出来，不会静默失败。
      api-key: ${LLM_API_KEY:}

      # 模型名。deepseek-flash 是价格较低的那档
      # （空闲时段价格是高峰时段的一半，周末和晚上都算空闲）
      model: deepseek-flash

      # 超时秒数。云端服务稳定，60 秒足够（本地小模型才需要 120 秒）
      timeout-seconds: 60

  # ----------------------------------------------------------
  # 聊天行为参数
  # ----------------------------------------------------------
  chat:
    # 纯聊天模式下携带的历史轮数（一轮 = 用户一条 + 机器人一条）
    history-rounds: 10
    # 每个用户允许的最短发消息间隔（毫秒），防止刷爆模型
    min-interval-millis: 1000

    # ----------------------------------------------------------
    # 普通对话模式的「场合规则」文件（不含 .md，放在 SysPrompt/ 下）
    #
    # 【提示词分两层，这是刻意拆开的】
    #   人设（谁）     ← /model-p 决定，或按身份自动选（chat_default / kong …）
    #   + 场合规则（怎么做）← 本字段；热聊模式下则改用 app.hot-chat.prompt-file
    #
    # 拆开的好处：你以后写各种 cos 角色文件时，不用把"怎么说话"的行为约束
    # 再抄一遍——那些规则跟角色无关。孙悟空和猫娘在群里插话的时机判断，
    # 是同一套逻辑。混在一个文件里的话，改一次规则要改 N 个角色文件，
    # 迟早会改漏。
    #
    # 两种场合是互斥的：
    #   被直接对话（@你 / 私聊）→ 本文件（chat_normal）
    #   热聊（群里旁观后主动插话）→ chat_hot
    # ----------------------------------------------------------
    normal-prompt-file: chat_normal

  # ----------------------------------------------------------
  # 管理员白名单（对应规格第 4.1 节）
  #
  # 这里填的是腾讯的 openid，【不是 QQ 号】。
  # 怎么拿到自己的 openid：先把机器人跑起来，在 QQ 里给它发一条消息，
  # 然后看应用日志里"收到消息"那一行打印的 userId，复制过来填在这里。
  #
  # 现阶段名单放配置里；等阶段五建好数据库会改成从表里查。
  # 真实的 openid 建议写在 application-local.yml 里，避免提交到 git。
  # ----------------------------------------------------------
  admin:
    user-ids: []

    # 管理员名单的存储文件。留空 = 默认的 data/admin-ids.txt
    #
    # 【为什么要能配】开发时如果另起一个测试实例（换端口跑），它和正式实例
    # 的工作目录相同，会操作同一个文件——测试往里面写测试 ID，
    # 正式实例重启后就读到了，结果是"名单里有个管理员但不是我"，被锁在外面。
    # 测试时把它指到别处即可隔离：
    #   storage-path: data-test/admin-ids.txt
    storage-path: ""

    # 名单为空时，是否把第一个发消息的人自动设为管理员。
    # 默认 false —— 推荐用 /admin 显式初始化（决定权在你手里）。
    # 设成 true 的话，机器人一公开就有"第一个陌生人成为管理员"的风险。
    auto-claim-first-user: false

# ============================================================
# 日志
# ============================================================
logging:
  level:
    # 本项目包下的日志用 DEBUG 级别，方便开发期看清每步流程
    com.mybotweb: DEBUG
    # Spring 自身的日志保持 INFO，避免刷屏
    root: INFO
